<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration | EventFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">EventFlow</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
      </ul>
      <div><a href="login.html" class="btn btn-secondary btn-sm">Login</a></div>
    </div>
  </nav>

  <main class="container" style="padding-top: 40px; max-width: 420px;">
    <div class="card">
      <h2 style="text-align: center; margin-bottom: 15px;">Student Sign Up</h2>

      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Campus Email</label>
          <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password (min 6 chars)</label>
          <input type="password" id="password" class="form-control" minlength="6" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <p style="text-align: center; margin-top: 15px; font-size: 0.9rem; color: #94a3b8;">
        Already registered? <a href="login.html">Sign in</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Event Management System</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
