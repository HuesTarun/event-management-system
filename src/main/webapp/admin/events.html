<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Events | EventFlow Admin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="dashboard.html" class="nav-brand">EventFlow Admin</a>
      <ul class="nav-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="events.html" class="active">Manage Events</a></li>
        <li><a href="../events.html">Public Site</a></li>
      </ul>
      <div id="nav-auth"></div>
    </div>
  </nav>

  <main class="container" style="padding-top: 30px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>Event Management</h2>
      <a href="event-form.html" class="btn btn-primary btn-sm">+ Add New Event</a>
    </div>

    <div class="card" style="padding: 0; overflow: hidden;">
      <table class="table" style="margin: 0;">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Venue</th>
            <th>Date &amp; Time</th>
            <th>Capacity</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="admin-events-body">
          <tr><td colspan="6" style="text-align: center; color: #94a3b8; padding: 25px;">Loading events...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Event Management System Admin</p>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
