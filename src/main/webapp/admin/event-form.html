<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Form | EventFlow Admin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="dashboard.html" class="nav-brand">EventFlow Admin</a>
      <ul class="nav-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="events.html" class="active">Manage Events</a></li>
        <li><a href="../events.html">Public Site</a></li>
      </ul>
      <div id="nav-auth"></div>
    </div>
  </nav>

  <main class="container" style="padding-top: 30px; max-width: 600px;">
    <p style="margin-bottom: 15px;"><a href="events.html" class="btn btn-secondary btn-sm">&larr; Back to Events</a></p>

    <div class="card">
      <h2 id="form-title" style="margin-bottom: 20px;">Create New Event</h2>

      <form id="event-form" onsubmit="saveEvent(event)">
        <input type="hidden" id="event-id" value="">

        <div class="form-group">
          <label class="form-label" for="title">Title *</label>
          <input type="text" id="title" class="form-control" placeholder="e.g. Web Development Workshop" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="venue">Venue *</label>
          <input type="text" id="venue" class="form-control" placeholder="e.g. Auditorium Hall A" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="capacity">Capacity (Seats) *</label>
          <input type="number" id="capacity" class="form-control" placeholder="50" min="1" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="eventDate">Date &amp; Time *</label>
          <input type="datetime-local" id="eventDate" class="form-control" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Description</label>
          <textarea id="description" class="form-control" rows="3" placeholder="Overview of the event..."></textarea>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Save Event</button>
          <a href="events.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Event Management System Admin</p>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
