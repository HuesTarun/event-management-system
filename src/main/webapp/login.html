<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | EventFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">EventFlow</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
      </ul>
      <div><a href="register.html" class="btn btn-primary btn-sm">Sign Up</a></div>
    </div>
  </nav>

  <main class="container" style="padding-top: 40px; max-width: 400px;">
    <div class="card">
      <h2 style="text-align: center; margin-bottom: 15px;">Sign In</h2>
      <div id="login-msg"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="user@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <p style="text-align: center; margin-top: 15px; font-size: 0.9rem; color: #94a3b8;">
        Don't have an account? <a href="register.html">Sign up</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Event Management System</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
